# Base sweep configuration. Frozen copies go into experiments/exp_XXX/ at
# execution time; runtime never reads this file directly (lab protocol).

server:
  url: http://127.0.0.1:8080
  api_key: none

models:
  - name: qwen2.5-1.5b-instruct-q4_0
    gguf: models/qwen2.5-1.5b-instruct-q4_0.gguf
    quant: Q4_0
  - name: qwen2.5-1.5b-instruct-q4_k_m
    gguf: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
    quant: Q4_K_M
  - name: qwen2.5-1.5b-instruct-q8_0
    gguf: models/qwen2.5-1.5b-instruct-q8_0.gguf
    quant: Q8_0

sweep:
  # Requested thread conditions; the driver caps this list at the host's
  # core count at runtime and records the effective list in the frozen
  # config.
  threads: [1, 2, 4, 8, 16]
  n_predict: 128
  repetitions: 5
  seed: 42
  prompts_file: configs/prompts.txt

hosts:
  primary_endpoint:
    provider: oracle
    shape: VM.Standard.A1.Flex
    ocpus: 2
    memory_gb: 12
    arch: neoverse-n1
    role: always-on judging endpoint (Always Free tier, post June 2026 limits)
  sweep_host:
    provider: hetzner
    shape: CAX41
    vcpus: 16
    memory_gb: 32
    arch: neoverse-n1
    role: full thread-scaling sweep, hourly billing
  v2_host:
    provider: gcp
    shape: c4a-standard-4
    arch: neoverse-v2
    role: cross-generation validation session
