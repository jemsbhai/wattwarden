[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwarden"
version = "0.0.1"
description = "Energy-governed AI agents on Arm CPUs: a TOML-model energy meter, sweep driver, and configuration advisor built on pollard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muntaser Syed", email = "jemsbhai@gmail.com" }]
keywords = ["arm", "energy", "llm", "agents", "pollard", "kleidiai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pollard[openai,mcp,hashrope,tokenmaster]>=1.5.1",
  "jsonld-ex[mcp]>=0.7.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
wattwarden = "wattwarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
